<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Destinations — GlobeTrotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="paper-texture">

<div id="site-nav"></div>

<header class="section" style="padding-bottom:20px;">
  <div class="container">
    <span class="eyebrow">Search</span>
    <h1>Find your next destination</h1>
    <div class="search-bar" style="max-width:560px; margin-bottom:18px;">
      <input type="search" id="search-input" placeholder="Search by name, country or vibe…" />
      <button class="btn btn-brass btn-sm" id="search-btn">Search</button>
    </div>
    <div class="chip-row" id="category-chips"></div>
  </div>
</header>

<section class="section" style="padding-top:24px;">
  <div class="container">
    <div class="section-head">
      <p class="muted" id="result-count">Loading destinations…</p>
      <div class="field" style="margin:0; min-width:220px;">
        <select id="max-cost">
          <option value="">Any budget</option>
          <option value="60">Under $60/day</option>
          <option value="120">Under $120/day</option>
          <option value="200">Under $200/day</option>
        </select>
      </div>
    </div>
    <div id="dest-grid" class="pass-grid">
      <div class="skeleton" style="height:220px"></div>
      <div class="skeleton" style="height:220px"></div>
      <div class="skeleton" style="height:220px"></div>
      <div class="skeleton" style="height:220px"></div>
    </div>
  </div>
</section>

<!-- Destination detail modal -->
<div class="modal-overlay" id="detail-overlay">
  <div class="modal" id="detail-modal"></div>
</div>

<footer class="site-footer">
  <div class="container">
    <span>GlobeTrotter Travel Assistant — Phase 1: The Monolith</span>
    <span>ICT University · CS Capstone</span>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/destinations.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — GlobeTrotter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="paper-texture">

<div id="site-nav"></div>

<header class="section" style="padding-bottom:0;">
  <div class="container">
    <span class="eyebrow" id="basis-label">Your dashboard</span>
    <h1 id="welcome-heading">Welcome back</h1>
    <p class="muted" id="welcome-sub">Here's what we'd suggest for your next trip.</p>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="search-bar" style="max-width:520px;">
      <input type="search" id="quick-search" placeholder="Search destinations — try 'beach' or 'Japan'" />
      <button class="btn btn-brass btn-sm" id="quick-search-btn">Search</button>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="eyebrow">Recommended for you</span>
        <h2>Destinations to consider</h2>
      </div>
      <a href="destinations.html" class="btn btn-ghost btn-sm">Browse all</a>
    </div>
    <div id="rec-grid" class="pass-grid">
      <div class="skeleton" style="height:220px"></div>
      <div class="skeleton" style="height:220px"></div>
      <div class="skeleton" style="height:220px"></div>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="section-head">
      <div>
        <span class="eyebrow">Upcoming</span>
        <h2>Your itineraries</h2>
      </div>
      <a href="itineraries.html" class="btn btn-ghost btn-sm">Manage itineraries</a>
    </div>
    <div id="itin-preview"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <span>GlobeTrotter Travel Assistant — Phase 1: The Monolith</span>
    <span>ICT University · CS Capstone</span>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  Auth.requireLogin();
  renderNav("dashboard");

  const user = Auth.getUser();
  document.getElementById("welcome-heading").textContent = `Welcome back, ${user?.name?.split(" ")[0] || "traveler"}`;

  function passCardHtml(d) {
    const matched = d.matched_preferences && d.matched_preferences.length
      ? `<span title="Matches your interests">✓ ${d.matched_preferences.slice(0,2).join(", ")}</span>` : "";
    return `
      <article class="pass-card">
        <div class="pass-main">
          <img class="pass-photo" src="${destPhotoUrl(d)}" alt="${escapeHtml(d.name)}" loading="lazy" />
          <h3 class="pass-dest">${escapeHtml(d.name)}</h3>
          <span class="pass-country">${escapeHtml(d.country)}</span>
          <p class="pass-desc">${escapeHtml(d.description)}</p>
          <div class="pass-meta"><span><strong>$${d.avg_cost_usd}</strong>/day</span>${matched}${d.already_planned ? "<span>Already in an itinerary</span>" : ""}</div>
          <div class="pass-actions">
            <a href="destinations.html?dest=${d.id}" class="btn btn-ghost btn-sm">Details</a>
            <button class="btn btn-primary btn-sm" onclick="quickPlan(${d.id}, '${escapeHtml(d.name).replace(/'/g, "\\'")}')">Plan trip</button>
          </div>
        </div>
        <div class="pass-stub">
          <div class="stamp-badge"><span class="rating">${d.rating}</span><span class="rating-label">RATING</span></div>
          <span class="pass-category">${escapeHtml(d.category)}</span>
        </div>
      </article>`;
  }

  async function loadRecommendations() {
    const grid = document.getElementById("rec-grid");
    try {
      const { basis, results } = await Api.getRecommendations(6);
      document.getElementById("basis-label").textContent = `Based on ${basis}`;
      grid.innerHTML = results.length
        ? results.map(passCardHtml).join("")
        : `<div class="empty-state"><h3>No destinations yet</h3><p>Try browsing all destinations instead.</p></div>`;
    } catch (err) {
      grid.innerHTML = `<div class="empty-state"><h3>Couldn't load recommendations</h3><p>${escapeHtml(err.message)}</p></div>`;
    }
  }

  async function loadItineraryPreview() {
    const mount = document.getElementById("itin-preview");
    try {
      const { results } = await Api.listItineraries();
      if (!results.length) {
        mount.innerHTML = `<div class="empty-state"><h3>No trips planned yet</h3><p>Pick a destination above and plan your first trip.</p></div>`;
        return;
      }
      const upcoming = results.slice(0, 3);
      mount.innerHTML = `<div class="pass-grid">${upcoming.map((it) => `
        <article class="pass-card itin-card">
          <div class="pass-main">
            <h3 class="pass-dest">${escapeHtml(it.title)}</h3>
            <span class="pass-country">${escapeHtml(it.destination?.name || "")}, ${escapeHtml(it.destination?.country || "")}</span>
            <div class="itin-dates">${formatDate(it.start_date)} → ${formatDate(it.end_date)}</div>
            <span class="status-pill status-${it.status}">${it.status}</span>
          </div>
          <div class="pass-stub">
            <img class="pass-photo" style="height:60px;width:60px;border-radius:50%;" src="${destPhotoUrl(it.destination || {name: it.title})}" alt="" />
          </div>
        </article>`).join("")}</div>`;
    } catch (err) {
      mount.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    }
  }

  function quickPlan(destinationId, destinationName) {
    window.location.href = `itineraries.html?plan=${destinationId}&name=${encodeURIComponent(destinationName)}`;
  }

  document.getElementById("quick-search-btn").addEventListener("click", runQuickSearch);
  document.getElementById("quick-search").addEventListener("keydown", (e) => { if (e.key === "Enter") runQuickSearch(); });
  function runQuickSearch() {
    const q = document.getElementById("quick-search").value.trim();
    window.location.href = `destinations.html${q ? `?search=${encodeURIComponent(q)}` : ""}`;
  }

  loadRecommendations();
  loadItineraryPreview();
</script>
</body>
</html>
